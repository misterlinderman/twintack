<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwinTack Navigation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 200vh;
            background-color: aquamarine;
        }

        .site-header {
            --nav-height: 60px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .corporate-nav {
            background: white;
            height: var(--nav-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            position: absolute;
            width: 100%;
            top: 0;
            /*transform: translateY(-100%);*/
            transition: transform 0.3s ease;
        }

        .site-header[data-nav-state="open"] .corporate-nav {
            transform: translateY(0);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            height: var(--nav-height);
            padding: 0 2rem;
            background: white;
            position: relative;
            z-index: 2;
            width: 240px;
        }

        .nav-toggle {
            background: none;
            border: none;
            padding: 0.5rem;
            cursor: pointer;
        }

        .nav-arrow {
            transition: transform 0.3s ease;
            transform: rotate(180deg);
        }

        [data-nav-state="open"] .nav-arrow {
            transform: rotate(0deg);
        }

        .corporate-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .category-nav {
            background: black;
            color: white;
            height: var(--nav-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            /*padding-left: calc(200px + 2rem);*/
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .site-header[data-nav-state="open"] .category-nav {
            transform: translateY(-100%);
        }

        .product-selector {
            position: relative;
            z-index: 1;
        }

        .select-products {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .product-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: #333;
            min-width: 200px;
            display: none;
            flex-direction: column;
        }

        .product-selector:hover .product-menu {
            display: flex;
        }

        .product-link {
            color: white;
            text-decoration: none;
            padding: 0.75rem 1rem;
            transition: background-color 0.2s ease;
        }

        .product-link:hover {
            background-color: #444;
        }

        .product-nav {
            display: flex;
            gap: 2rem;
        }

        .product-nav a {
            color: white;
            text-decoration: none;
        }

        main {
            padding-top: calc(var(--nav-height) + 2rem);
            margin: 0 2rem;
        }

        h1 {
            margin-top: 2em;
        }
    </style>
</head>
<body>
    <header class="site-header" data-nav-state="closed">
        <nav class="corporate-nav">
            <div></div>
            <ul class="corporate-menu">
                <li><a href="#home">HOME</a></li>
                <li><a href="#technology">TECHNOLOGY</a></li>
                <li><a href="#story">STORY</a></li>
                <li><a href="#partners">PARTNERS</a></li>
                <li><a href="#team">TEAM</a></li>
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </nav>

        <div class="logo-container">
            <img src="https://placehold.co/120x40" alt="TwinTack">
            <button class="nav-toggle" aria-label="Toggle Navigation">
                <svg class="nav-arrow" viewBox="0 0 24 24" width="24" height="24">
                    <path d="M7 10l5 5 5-5H7z" fill="currentColor"/>
                </svg>
            </button>
        </div>

        <div class="category-nav">
            <div class="product-selector">
                <button class="select-products">
                    SELECT PRODUCTS
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path d="M7 10l5 5 5-5H7z" fill="currentColor"/>
                    </svg>
                </button>
                <div class="product-menu">
                    <a href="#baseball" class="product-link">BASEBALL</a>
                    <a href="#fishing" class="product-link">FISHING</a>
                </div>
            </div>

            <nav class="product-nav">
                <a href="#baseball">BASEBALL</a>
                <a href="#custom-grips">CUSTOM GRIPS</a>
                <a href="#technology">TECHNOLOGY</a>
                <a href="#apparel">APPAREL</a>
                <a href="#howto">HOW TO</a>
                <a href="#partners">PARTNERS</a>
            </nav>
        </div>
    </header>

    <main>
        <h1>Content Area</h1>
        <p>Scroll down to see the fixed navigation in action.</p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const header = document.querySelector('.site-header');
            const navToggle = header.querySelector('.nav-toggle');

            navToggle.addEventListener('click', () => {
                const currentState = header.dataset.navState;
                header.dataset.navState = currentState === 'closed' ? 'open' : 'closed';
            });

            document.addEventListener('click', (e) => {
                if (!header.contains(e.target) && header.dataset.navState === 'closed') {
                    header.dataset.navState = 'open';
                }
            });
        });
    </script>
</body>
</html>
